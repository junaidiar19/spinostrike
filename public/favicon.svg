<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded Tactical Background -->
  <rect width="512" height="512" rx="112" fill="#090d16" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Crosshair Circle -->
  <circle cx="256" cy="256" r="180" stroke="#f59e0b" stroke-width="12" stroke-dasharray="140 30" opacity="0.9" />
  <circle cx="256" cy="256" r="130" stroke="#0ea5e9" stroke-width="6" opacity="0.75" />
  
  <!-- Crosshair Axis Ticks -->
  <line x1="256" y1="40" x2="256" y2="100" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="412" x2="256" y2="472" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
  <line x1="40" y1="256" x2="100" y2="256" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
  <line x1="412" y1="256" x2="472" y2="256" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />

  <!-- Tactical Strike Chevron & 'S' -->
  <path d="M190 170 L320 170 L230 256 L330 256 L200 350" stroke="#f59e0b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>